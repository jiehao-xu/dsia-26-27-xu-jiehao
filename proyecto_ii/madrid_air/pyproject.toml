[project]
name = "no2-madrid"
version = "0.1.0"
description = "Pipeline reproducible de predicción diaria de NO2 en Madrid"
readme = "README.md"
authors = [
    { name = "jiehao", email = "jiehaoxu1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4",
    "google-genai>=1.0,<3",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: flujo completo sin red ni credenciales"]

[project.scripts]
no2-madrid = "no2_madrid:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
