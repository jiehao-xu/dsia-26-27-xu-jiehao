[project]
name = "madrid-air"
version = "0.1.0"
description = "Pipeline CSV de calidad del aire en Escuelas Aguirre"
readme = "README.md"
authors = [
    { name = "jiehao", email = "jiehaoxu1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "httpx>=0.27,<1.0",
    "matplotlib>=3.9",
]

[project.scripts]
madrid-air = "madrid_air.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
