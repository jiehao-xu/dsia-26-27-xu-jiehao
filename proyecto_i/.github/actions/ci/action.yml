name: CI Proyecto I
description: Instala las dependencias y comprueba ambas partes en Python 3.12.

runs:
  using: composite
  steps:
    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: proyecto_i/requirements.txt

    - name: Instalar dependencias
      shell: bash
      working-directory: proyecto_i
      run: pip install -r requirements.txt

    - name: Tests y cobertura de ambos paquetes
      shell: bash
      working-directory: proyecto_i
      run: pytest --cov=ventas_app --cov=internet_app --cov-report=term-missing --cov-fail-under=60
