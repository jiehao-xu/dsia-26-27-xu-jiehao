[project]
name = "proyecto-i"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["integration: ejecuta la aplicación completa desde la terminal"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
