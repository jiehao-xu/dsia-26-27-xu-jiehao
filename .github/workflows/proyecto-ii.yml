name: CI Proyecto II

on:
  push:
    paths:
      - 'proyecto_ii/madrid_air/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/proyecto-ii.yml'
  pull_request:
    paths:
      - 'proyecto_ii/madrid_air/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/proyecto-ii.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proyecto_ii/madrid_air
    env:
      AI_MODE: mock
      GOOGLE_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.mpl-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar uv
        run: python -m pip install uv==0.12.9
      - name: Instalar dependencias bloqueadas del workspace
        run: uv sync --locked --package no2-madrid --group dev
      - name: Tests unitarios e integración sin servicios externos
        run: uv run --locked --package no2-madrid pytest -q
      - name: Demostración completa con IA mock
        run: uv run --locked --package no2-madrid no2-madrid demo --dir artifacts/ci-demo
      - name: Prueba rápida con modelo y muestra reales incluidos
        run: uv run --locked --package no2-madrid no2-madrid quick-demo --dir artifacts/ci-quick-demo
