name: CI Proyecto II

on:
  push:
    paths: ['proyecto_ii/**', 'pyproject.toml', 'uv.lock', '.github/workflows/proyecto-ii.yml']
  pull_request:
    paths: ['proyecto_ii/**', 'pyproject.toml', 'uv.lock', '.github/workflows/proyecto-ii.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_MODE: mock
      GOOGLE_API_KEY: ''
      AEMET_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar uv
        run: python -m pip install uv==0.12.9
      - name: Instalar dependencias bloqueadas
        run: uv sync --locked --package madrid-air --group dev
      - name: Tests unitarios e integración (sin red durante los tests)
        run: uv run --locked --package madrid-air pytest proyecto_ii/tests -q
